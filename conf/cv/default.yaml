# @package cv

enabled: false
scheme: stratified_kfold     # fold_column | stratified_kfold | group_kfold
n_splits: 5
n_repeats: 1
ensemble_seeds: 1
save_models: false
oof_out: cv_oof_predictions.csv
objective: mean              # mean | mean_minus_std
std_penalty: 0.5
# Метрика целевой функции CV (то, что возвращается в Optuna, maximize):
#   null    — score выбора эпохи (training.monitor_metric; при monitor_metric=loss это -loss)
#   roc_auc | balanced_accuracy | f1 | ... — из training.metrics на val-части fold
#   loss    — -val_loss (только scope=fold)
objective_metric: null
# fold — среднее метрики по fold/seed; oof — метрика по пулу OOF-предсказаний
objective_scope: fold        # fold | oof
# Оценивать ли holdout ансамблем fold-моделей. Для подбора модели ставить false:
# holdout смотреть один раз в конце.
evaluate_holdout: true
